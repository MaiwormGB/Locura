<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">

        <div class="left">

            <div class="status">

                <h1>STATUS</h1>

                <h2>NOMES</h2>

                <div id="nomes" onclick="val = 1; borrarFundo();">

                    <h3 id="nome">[NOME]</h3>
                    <h4 id="jogador">[JOGADOR]</h4>

                </div>
             
                <h2>CDs</h2>

                <div class="cds" onclick="val = 2; borrarFundo();">

                    <div class="cd" id="defesa"></div>
                    <div class="cd" id="integridade"></div>
                    

                </div>

                <h2>ATRIBUTOS</h2>

                <div class="atributos">

                    <h2>Agi | 1</h2>
                    <h2>For | 1</h2>
                    <h2>Int | 1</h2>
                    <h2>Pre | 1</h2>
                    <h2>Vig | 1</h2>

                </div>


            </div>


        </div>

        <div class="right">

            <div id="nav">

                <button onclick="pagina --">Anterior</button>
                <button onclick="pagina ++">Proximo</button>

            </div>

            <div class="container" id="pericias">

                <h2>Pericias</h2>

            </div>

             <div class="container" id="combate">

                <h2>Combate</h2>

            </div>

            <div class="container" id="relvas">

                <h2>Relvas</h2>

            </div>

             <div class="container" id="inventario">

                <h2>Inventario</h2>

            </div>

             <div class="container" id="talentos">

                <h2>Talentos</h2>

            </div>

             <div class="container" id="info">

                <h2>Info</h2>

            </div>



        </div>


        <div class="blur" id="blur" onclick="val = 0; borrarFundo();">

            <div class="editar" id="editarNome" onclick="event.stopPropagation();">

                <h1>Editar nome</h1>
                
                <input type="text" id="novoNome" placeholder="Novo nome">
                <input type="text" id="novoJogador" placeholder="Novo jogador">

                <button id="salvar" onclick="borrarFundo()">confirmar</button>

            </div>

            <div class="editar" id="editarDefesa" onclick="event.stopPropagation();">

                <h1>Editar defesa</h1>
                
                <p>Calculo | 10 + Agi + Vig + Mod </p>

                <!--trocar mod unico para log de mods-->

                <input type="number" id="novaAgi">
                <input type="number" id="novoVig">
                <input type="number" id="novoMod">

                <button id="salvar" onclick="borrarFundo()">confirmar</button>

            </div>

        </div>

    </div>
    
    <script src="script.js"></script>

</body>
</html>
